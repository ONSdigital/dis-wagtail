---
services:
  web:
    build:
      context: .
      target: dev
      args:
        - GIT_COMMIT=
        - BUILD_TIME=
        - TAG=
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://ons:ons@db:${DB_PORT:-5432}/ons # pragma: allowlist secret
      DJANGO_SETTINGS_MODULE: cms.settings.dev
      ENABLE_DJANGO_DEFENDER: 'false'
      MEDIA_DIR: /app/media/
      REDIS_URL: redis://redis
      SECRET_KEY: local_dev_secret_key # pragma: allowlist secret
      WAGTAILADMIN_BASE_URL: 'http://localhost:${WEB_PORT:-8000}'
      STATIC_DIR: /app/static/
      STATIC_URL: /static/
      KAFKA_SERVERS: broker:9092
      WAGTAIL_CORE_ADMIN_LOGIN_ENABLED: true
      EMAIL_HOST: mailpit
    ports:
      - ${WEBPACK_PORT:-3000}:3000 # webpack
      - ${WEB_PORT:-8000}:${WEB_PORT:-8000} # runserver
      - ${MKDOCS_PORT:-8001}:8001 # mkdocs serve
    volumes:
      # Mount the repo at /app/
      - ./:/app/
      # Mount a volume at /app/node_modules to prevent Docker trying to sync the
      # contents between the container and the host. This means that the
      # node_modules directory can appear to have different contents depending
      # on whether you are looking at it from the host or the container, so make
      # sure you consistently run Node.js commands from inside the container or
      # the host, but not both.
      - node_modules:/app/node_modules
    init: true
    depends_on:
      - db
      - redis

  db:
    extends:
      file: docker-compose-dev.yml
      service: db
  redis:
    extends:
      file: docker-compose-dev.yml
      service: redis

  broker:
    extends:
      file: docker-compose-dev.yml
      service: broker

  mailpit:
    extends:
      file: docker-compose-dev.yml
      service: mailpit

  # Opt-in mock of the chart exporter API, see docs/integrations/chart_exporter.md.
  # Start it with `docker compose --profile chart-exporter-mock up -d chart-exporter-mock`,
  # then set CMS_CHART_EXPORTER_API_ENABLED=true and
  # CMS_CHART_EXPORTER_API_BASE_URL=http://chart-exporter-mock:30300 for web.
  chart-exporter-mock:
    extends:
      service: web
    profiles:
      - chart-exporter-mock
    command:
      - python
      - -m
      - cms.datavis.tests.chart_exporter_mock
      - --host
      - 0.0.0.0
      - --port
      - '30300'
      # Write PNGs to web's MEDIA_DIR, so the CMS can serve them
      - --output-dir
      - /app/media
    ports: !override
      - ${CHART_EXPORTER_MOCK_HOST_PORT:-30300}:30300
    volumes: !override
      - ./:/app/
    depends_on: !reset []

volumes:
  node_modules:
  pgdata:
